# Le gate : les trois plateformes sur la pull request, Ubuntu seul pendant
# l'itération.
#
# `scripts/check.sh` est la seule définition de ce qui est vert : ce fichier ne
# fait que l'installer et le lancer. Une règle qui n'existerait que dans la CI
# serait une règle que personne ne peut vérifier avant de pousser.
#
# La matrice dépend de l'événement. Une session autonome pousse plusieurs fois
# par nuit sur sa branche : payer le facteur 10 de macOS à chaque commit
# épuiserait le quota d'un dépôt privé en une semaine. La couverture complète
# revient là où elle décide de quelque chose, la PR, et le `push` garde un
# Ubuntu qui casse tôt.
#
# Les jeux de photos de référence ne sont pas dans le dépôt (des giga-octets
# de photos de famille) : le linter compose alors depuis leurs fiches
# versionnées (crates/colophon-core/fiches) et rend le même verdict que sur le
# Mac. Seul le PDF → PNG se saute hors macOS (sips), en le disant.

name: check

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["macos-14", "ubuntu-24.04", "windows-2022"]') || fromJSON('["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: crates/colophon-app/package-lock.json

      - name: npm ci
        working-directory: crates/colophon-app
        run: npm ci

      - name: Pillow, pour le PDF → PNG
        run: python3 -m pip install --user --break-system-packages Pillow || true

      # Bash sur Windows aussi : check.sh est le gate, pas une variante par
      # plateforme. Le code de sortie se lit tel quel, jamais à travers un tube.
      - name: check.sh
        shell: bash
        run: ./scripts/check.sh
