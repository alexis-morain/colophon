# Une release, déclenchée par un tag `v*`.
#
# Produit les binaires macOS (arm64 et x64) et Windows, leurs empreintes
# SHA-256, et les notes tirées du CHANGELOG. Les noms de fichiers suivent la
# convention que le site lit par l'API publique de GitHub :
#
#   Colophon-0.9.0-macos-arm64.dmg
#   Colophon-0.9.0-macos-x64.dmg
#   Colophon-0.9.0-windows-x64.msi
#
# C'est un contrat, pas un détail de présentation : renommer un fichier casse
# le bouton de téléchargement du site.
#
# **Le DMG macOS est signé Developer ID et notarisé** quand les cinq secrets
# Apple sont posés : APPLE_CERTIFICATE (le .p12 en base64),
# APPLE_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_PASSWORD (un mot de passe
# d'application, jamais celui du compte) et APPLE_TEAM_ID. **Tous ou aucun** :
# sans aucun, le DMG sort nu et l'étape le dit en avertissement — Gatekeeper le
# met alors en quarantaine chez tout le monde ; avec une partie seulement, la
# release échoue, parce qu'un DMG signé mais non notarisé est bloqué comme un
# DMG nu et que Tauri ne s'en plaindrait qu'en jaune.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier, sans le v (ex. 0.9.0)"
        required: true

permissions:
  contents: write

jobs:
  # Le gate d'abord : un tag ne se coupe pas sur un commit rouge. C'est le
  # même check.sh que la PR, sur Ubuntu — le vert des trois OS a déjà été
  # exigé pour entrer dans main.
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: crates/colophon-app/package-lock.json
      - name: npm ci
        working-directory: crates/colophon-app
        run: npm ci
      - name: check.sh
        shell: bash
        run: ./scripts/check.sh

  build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            cible: aarch64-apple-darwin
            suffixe: macos-arm64
            extension: dmg
          - os: macos-14
            cible: x86_64-apple-darwin
            suffixe: macos-x64
            extension: dmg
          - os: windows-2022
            cible: x86_64-pc-windows-msvc
            suffixe: windows-x64
            extension: msi
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Un secret ne se lit pas dans un `if:` d'étape, et l'`env:` d'une étape
    # ne se lit pas dans son propre `if:` : la question se pose ici, une fois.
    env:
      SIGNER: ${{ secrets.APPLE_CERTIFICATE != '' }}

    steps:
      - uses: actions/checkout@v4

      # La version du tag doit être celle des quatre fichiers, sinon le DMG
      # porte un numéro, l'app installée un autre, et latest.json un
      # troisième : chaque utilisateur verrait une mise à jour permanente.
      # Et le CHANGELOG doit avoir sa section, sinon les notes diraient
      # « Version X. » et rien d'autre.
      - id: version
        shell: bash
        run: |
          v="${{ github.event.inputs.version }}"
          [ -n "$v" ] || v="${GITHUB_REF_NAME#v}"
          python3 scripts/versions.py --attendue "$v"
          grep -q "^## \[$v\]" CHANGELOG.md \
            || { echo "CHANGELOG.md n'a pas de section ## [$v]" >&2; exit 1; }
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cible }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: crates/colophon-app/package-lock.json

      - name: npm ci
        working-directory: crates/colophon-app
        run: npm ci

      # Les notices des licences tierces voyagent dans le binaire : l'écran
      # À propos les lit depuis `include_str!`. Une release sans elles
      # publierait une app en violation de licence.
      - name: Notices des licences tierces
        shell: bash
        run: |
          cargo install cargo-about --locked --features cli
          ./scripts/notices.sh

      - name: Secrets Apple, tous ou aucun
        if: runner.os == 'macOS'
        shell: bash
        env:
          C: ${{ secrets.APPLE_CERTIFICATE != '' }}
          CP: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          ID: ${{ secrets.APPLE_ID != '' }}
          PW: ${{ secrets.APPLE_PASSWORD != '' }}
          TEAM: ${{ secrets.APPLE_TEAM_ID != '' }}
        run: |
          poses="$C$CP$ID$PW$TEAM"
          case "$poses" in
            truetruetruetruetrue) echo "les cinq secrets Apple sont posés : signature et notarisation" ;;
            falsefalsefalsefalsefalse)
              echo "::warning::Aucun secret Apple : le DMG sort sans signature, Gatekeeper le mettra en quarantaine." ;;
            *) echo "::error::Secrets Apple incomplets (certificat $C, mot de passe $CP, APPLE_ID $ID, APPLE_PASSWORD $PW, APPLE_TEAM_ID $TEAM)."
               exit 1 ;;
          esac

      # La clé privée vit dans le .env d'Alexis et dans ce secret, jamais
      # dans le dépôt. Sans elle, le bundle sort quand même : ce sont les
      # artefacts de mise à jour, et eux seuls, qui ne sont pas produits.
      - name: Bundle
        working-directory: crates/colophon-app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          S_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          S_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          S_APPLE_ID: ${{ secrets.APPLE_ID }}
          S_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          S_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Tauri lit les variables Apple par leur seule présence : une
        # variable vide vaudrait un certificat vide et ferait échouer
        # l'import. Elles ne sont donc exportées que posées. Avec elles,
        # Tauri importe le certificat dans un trousseau jetable, signe l'app
        # en runtime durci avec `entitlements.plist`, la notarise, l'agrafe,
        # puis signe le DMG. `--config` ajoute la seule clé qui n'a pas sa
        # place dans le fichier principal : les artefacts de mise à jour
        # exigent la clé de signature, et un développeur qui compile chez lui
        # ne l'a pas.
        run: |
          set -eu
          if [ "$RUNNER_OS" = "macOS" ] && [ "$SIGNER" = "true" ]; then
            export APPLE_CERTIFICATE="$S_APPLE_CERTIFICATE"
            export APPLE_CERTIFICATE_PASSWORD="$S_APPLE_CERTIFICATE_PASSWORD"
            export APPLE_ID="$S_APPLE_ID"
            export APPLE_PASSWORD="$S_APPLE_PASSWORD"
            export APPLE_TEAM_ID="$S_APPLE_TEAM_ID"
          fi
          npm run tauri build -- \
            --target ${{ matrix.cible }} \
            --config src-tauri/tauri.release.conf.json

      # Tauri ne notarise que l'app, et le DMG est ce qu'on télécharge :
      # Gatekeeper juge d'abord lui. Puis on vérifie au lieu de supposer —
      # runtime durci, clé de la photothèque, autorité Developer ID, tickets
      # agrafés, verdict de `spctl` — sur l'app même qui part dans le DMG.
      - name: Notariser le DMG et vérifier la signature
        if: runner.os == 'macOS' && env.SIGNER == 'true'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eu
          bundle="target/${{ matrix.cible }}/release/bundle"
          app="$bundle/macos/Colophon.app"
          dmg="$(find "$bundle/dmg" -name '*.dmg' -type f | head -1)"
          [ -n "$dmg" ] || { echo "aucun DMG produit" >&2; exit 1; }
          ./scripts/signature-macos.sh verifier "$app" --distribution
          ./scripts/signature-macos.sh notariser "$dmg"
          ./scripts/signature-macos.sh gatekeeper "$app" "$dmg"

      # Un seul nom par plateforme, celui que le site attend, plus son
      # empreinte à côté : un téléchargement qu'on ne peut pas vérifier n'est
      # pas un téléchargement sûr.
      - name: Renommer et empreindre
        shell: bash
        run: |
          set -eu
          v="${{ steps.version.outputs.v }}"
          nom="Colophon-$v-${{ matrix.suffixe }}.${{ matrix.extension }}"
          mkdir -p publication
          src="$(find "target/${{ matrix.cible }}/release/bundle" \
            -name "*.${{ matrix.extension }}" -type f | head -1)"
          [ -n "$src" ] || { echo "aucun ${{ matrix.extension }} produit" >&2; exit 1; }
          cp "$src" "publication/$nom"
          # L'archive de mise à jour et sa signature, quand la clé était là.
          # Le fichier .sig est ce que l'updater vérifie avant d'installer
          # quoi que ce soit : sans lui, pas de mise à jour, et c'est voulu.
          maj="$(find "target/${{ matrix.cible }}/release/bundle" \
            \( -name "*.app.tar.gz" -o -name "*-setup.nsis.zip" -o -name "*.msi.zip" \) \
            -type f | head -1)"
          if [ -n "$maj" ] && [ -f "$maj.sig" ]; then
            case "$maj" in
              *.tar.gz) ext="tar.gz" ;;
              *) ext="zip" ;;
            esac
            cp "$maj" "publication/Colophon-$v-${{ matrix.suffixe }}-maj.$ext"
            cp "$maj.sig" "publication/Colophon-$v-${{ matrix.suffixe }}-maj.sig"
            echo "artefact de mise à jour signé : $(basename "$maj")"
          else
            echo "pas d'artefact de mise à jour : la clé de signature manque" >&2
          fi
          cd publication
          if command -v shasum >/dev/null; then
            shasum -a 256 "$nom" > "$nom.sha256"
          else
            certutil -hashfile "$nom" SHA256 > "$nom.sha256"
          fi
          cat "$nom.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: colophon-${{ matrix.suffixe }}
          path: publication/*

  publier:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: publication
          merge-multiple: true

      # Les notes de version sortent du CHANGELOG, jamais d'une liste de
      # commits : ce que lit un utilisateur, c'est ce qui change pour lui.
      - name: Notes de version depuis le CHANGELOG
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          python3 - "$v" <<'PY' > notes.md
          import re, sys
          from pathlib import Path
          v = sys.argv[1]
          texte = Path("CHANGELOG.md").read_text(encoding="utf-8")
          blocs = re.split(r"^## ", texte, flags=re.M)
          for b in blocs:
              if b.startswith(f"[{v}]"):
                  print("\n".join(b.split("\n")[1:]).strip())
                  break
          else:
              # Le job de version l'a déjà refusé ; ceinture et bretelles.
              print(f"CHANGELOG.md : pas de section [{v}]", file=sys.stderr)
              raise SystemExit(1)
          PY
          echo >> notes.md
          echo "## Empreintes SHA-256" >> notes.md
          echo >> notes.md
          echo '```' >> notes.md
          cat publication/*.sha256 >> notes.md
          echo '```' >> notes.md

      # Le manifeste que l'app interroge au lancement. Son URL est écrite
      # dans tauri.conf.json : `releases/latest/download/latest.json`. Sans
      # artefact signé il n'est pas écrit du tout, plutôt qu'écrit vide :
      # un manifeste sans signature ferait échouer chaque vérification, et
      # personne ne saurait pourquoi.
      - name: Manifeste de mise à jour
        shell: bash
        run: |
          set -eu
          v="${GITHUB_REF_NAME#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          python3 - "$v" "$base" <<'PY'
          import json, sys
          from pathlib import Path
          v, base = sys.argv[1], sys.argv[2]
          cibles = {
              "macos-arm64": "darwin-aarch64",
              "macos-x64": "darwin-x86_64",
              "windows-x64": "windows-x86_64",
          }
          pub = Path("publication")
          platformes = {}
          for suffixe, cle in cibles.items():
              sig = pub / f"Colophon-{v}-{suffixe}-maj.sig"
              if not sig.is_file():
                  continue
              archive = next(
                  (p for p in pub.glob(f"Colophon-{v}-{suffixe}-maj.*")
                   if p.suffix != ".sig"), None)
              if archive is None:
                  continue
              platformes[cle] = {
                  "signature": sig.read_text().strip(),
                  "url": f"{base}/{archive.name}",
              }
          if not platformes:
              print("aucun artefact signé : pas de latest.json", file=sys.stderr)
              raise SystemExit(0)
          notes = Path("notes.md").read_text(encoding="utf-8") if Path("notes.md").is_file() else ""
          (pub / "latest.json").write_text(json.dumps({
              "version": v,
              "notes": notes.strip()[:2000],
              "platforms": platformes,
          }, indent=2, ensure_ascii=False), encoding="utf-8")
          print(f"latest.json : {len(platformes)} plateformes")
          PY

      - uses: softprops/action-gh-release@v2
        with:
          files: publication/*
          body_path: notes.md
          draft: true
          fail_on_unmatched_files: true
