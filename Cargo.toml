[workspace]
resolver = "2"
members = ["crates/colophon-core", "crates/colophon-cli", "crates/colophon-app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/alexis-morain/colophon"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
image_hasher = "3.1"
kamadak-exif = "0.5"
lopdf = "0.34"
rayon = "1"
rustface = "0.1.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[profile.release]
opt-level = 3
