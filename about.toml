# cargo-about: what the third-party notices are generated from.
#
# The workspace ships as a desktop binary on macOS and Windows; the crates
# that only ever build on other targets have no notice to give, so they are
# not asked for one.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
    "OFL-1.1",
    "CDLA-Permissive-2.0",
    "Unlicense",
    # The project itself.
    "GPL-3.0-or-later",
]

targets = [
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

# Colophon's own crates are not a third party to itself: their GPL-3.0 is the
# project's licence, published at the root of the repository.
[private]
ignore = true
