<!-- Marque 1, « le pli ».

     Une double page vue de dessus : deux pages, un pli au milieu, une
     photographie posée sur la page de droite et qui ne le traverse pas.
     C'est la seule règle du composeur qu'on peut dessiner, et la seule
     chose qu'un lecteur reconnaît sans légende : un livre ouvert.

     Aucun dégradé, deux aplats et un trait. À 32 px il reste un livre. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#f6f2e9"/>
  <!-- La double page, marges égales, format carré comme l'album courant. -->
  <rect x="72" y="136" width="368" height="240" fill="#ffffff"/>
  <!-- La photographie, sur la page de droite, à fond perdu sur trois côtés
       et arrêtée net au pli. -->
  <rect x="256" y="136" width="184" height="240" fill="#b04a1f"/>
  <!-- Le pli, une ligne et pas une ombre : sur le papier c'est une arête. -->
  <rect x="254" y="136" width="4" height="240" fill="#3a342c"/>
  <!-- Le filet du bloc, qui tient la forme quand elle rétrécit. -->
  <rect x="72" y="136" width="368" height="240" fill="none" stroke="#3a342c" stroke-width="8"/>
</svg>
